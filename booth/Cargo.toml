[package]
name = "booth"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A DJ library that prepares tracks and writes drives Pioneer/AlphaTheta players can read"
license = "MIT"

[lib]
name = "booth"
path = "src/lib.rs"

[[bin]]
name = "booth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-std = "1"
cpal = "0.18"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
musicai = { path = ".." }
rayon = "1"
# Native file pickers, on the same terms as the other window: the xdg-portal
# backend needs no GTK development packages, and is async-only, so the dialogs
# are driven from a thread that is not the one painting.
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# For statvfs, so the preflight's free-space check uses each platform's own
# struct definition rather than a hand-written guess at its layout.
libc = "0.2"

[features]
# eframe can paint one frame, write it out and exit, which is how the layout is
# checked under a headless X server rather than by looking at it.
screenshot = ["eframe/__screenshot"]

[dev-dependencies]
ttf-parser = "0.25.1"
