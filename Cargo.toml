[workspace]
resolver = "2"
members = ["booth", "gui", "proto/musicai"]

# `cargo build` with nothing else said builds Booth, which is the program this
# repository is for. Everything else is still one flag away: `--workspace` for
# all of it, `-p booth-cli` for the command-line tool.
default-members = ["booth"]

# Three crates, because they are three different programs sharing one engine.
#
# `booth` is the library: it holds a collection, and the work it does is in
# service of what goes on a drive. It is what the macOS app launches.
#
# `proto/musicai` is where the analysis, tagging and export code lives, with a
# command-line tool wrapped around it. It came first, and everything above is
# built on it — the name of its directory is about which interface came first,
# not about the code being provisional.
#
# `gui` is the older batch window: pick files, pick a task, run it. It is not a
# tab of Booth, and trying to make it one produces a worse version of both.
#
# The windows live apart from the engine so that eframe and its several hundred
# dependencies stay out of the command-line tool entirely.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
