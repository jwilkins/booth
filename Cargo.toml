[workspace]
members = ["gui"]

# The window lives in its own crate so that eframe and its several hundred
# dependencies stay out of the command-line tool entirely: `cargo build` still
# builds just the CLI, and the CLI keeps its own (much lower) minimum Rust
# version.

[package]
name = "musicai"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local audio toolkit: EBU R128 loudness normalization and stem separation for mp3/flac/wav"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23.0"
clap = { version = "4", features = ["derive", "env"] }
ebur128 = "0.1"
flacenc = "0.5"
hound = "3.5"
id3 = "1"
metaflac = "0.2"
mp3lame-encoder = "0.2"
rayon = "1"
realfft = "3.5"
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "id3v1",
    "id3v2",
] }
ureq = "3.2.1"
walkdir = "2"

[dev-dependencies]
binrw = "0.14"
# The integration tests read back the tags the ReplayGain mode writes.
id3 = "1"
metaflac = "0.2"
rekordcrate = { version = "0.3.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
