[package]
name = "booth-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Local audio toolkit: EBU R128 loudness normalization and stem separation for mp3/flac/wav"
license-file = "../../LICENSE"

# The package, the library and the command all say the same thing, so the
# binary needs no naming of its own: cargo takes it from the package.
#
# The directory keeps the old name. It is where this came from, and moving it
# again would churn every path in the docs for nothing.

[dependencies]
anyhow = "1"
base64 = "0.23.0"
clap = { version = "4", features = ["derive", "env"] }
ebur128 = "0.1"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
flacenc = "0.5"
hound = "3.5"
id3 = "1"
# Asking the system about a drive and a write to it: how much room it has
# before writing (statvfs), and reading a write back past the page cache.
libc = "0.2"
metaflac = "0.2"
mp3lame-encoder = "0.2"
mp4ameta = "0.13.0"
# SQLCipher, for reading rekordbox's own encrypted libraries. Bundled and
# vendored rather than linked against whatever is installed: the page format
# and HMAC scheme are SQLCipher's, and using its own implementation is the
# only way to be sure of reading them the way it wrote them.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rayon = "1"
realfft = "3.5"
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "id3v1",
    "id3v2",
    # Apple's containers and codecs: m4a is ISO-MP4 holding AAC or ALAC. A CDJ
    # plays both, and a real library has a lot of them, so we decode them for
    # analysis. Only decoding — the encoders stay LAME/flac/hound.
    "isomp4",
    "aac",
    "alac",
    "aiff",
    # Ogg, for Vorbis and for Opus. No player opens either, so they are decoded
    # to be analysed, converted to FLAC, or re-encoded on the way onto a drive.
    # Opus itself is decoded by rusty-opus below: symphonia has no decoder.
    "ogg",
    "vorbis",
] }
# Opus, which symphonia demuxes and cannot decode. Pure Rust, no build step. On
# a 30-second CC record encoded at 160 kbps it decodes in 96 ms and lands 83 dB
# from libopus's own float decode; ffmpeg's built-in Opus decoder is 70 dB from
# libopus on the same file. `opus-decoder`, the other pure-Rust choice, was 87 dB
# and took 12.6 s for the same 30 seconds.
rusty-opus = "1.0.2"
# For the one resampling written into the library: a file above the 96 kHz a
# player takes, converted to FLAC at half or a quarter of its rate. Halving a
# 192 kHz signal it keeps 40 kHz flat to 0.0001 dB and folds ultrasonic tones
# back at -149 dB or below, where `audio::resample` manages -111 dB; it was
# already compiled in, by rusty-chromaprint.
rubato = "0.16.2"
ureq = "3.2.1"
walkdir = "2"
sha2 = "0.10.9"
tract-onnx = "0.23"

[dev-dependencies]
binrw = "0.14"
# The integration tests read back the tags the ReplayGain mode writes.
id3 = "1"
metaflac = "0.2"
rekordcrate = { version = "0.3.0", default-features = false }
